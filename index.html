<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<!-- Login Screen -->

<div id="loginScreen" class="login-screen">

    <div class="login-box">

        <!-- Sign In -->

        <div class="login-side sign-in-side">

            <button id="signInBtn" class="account-button">
                Sign In
            </button>

            <p>Login into existing account</p>

        </div>


        <!-- Sign Up -->

        <div class="login-side sign-up-side">

            <button id="signUpBtn" class="account-button">
                Sign Up
            </button>

            <p>Create a new account</p>

        </div>

    </div>

</div>

<!-- ============================= -->
<!-- SIGN UP PAGE -->
<!-- ============================= -->

<div id="signUpPage" class="sign-up-page">

    <div class="sign-up-box">

        <button id="backToLoginBtn" class="back-button">
            ← Back
        </button>

        <h1>Sign Up</h1>

        <!-- Username -->

        <label for="usernameInput">
            Username
        </label>

        <input
            type="text"
            id="usernameInput"
            placeholder="Enter username"
            autocomplete="off"
        >


        <!-- Password -->

        <label for="passwordInput">
            Password
        </label>

        <div class="password-container">

            <input
                type="password"
                id="passwordInput"
                placeholder="Enter password"
                autocomplete="new-password"
            >

            <button
                type="button"
                id="passwordToggleBtn"
            >
                Show Pass
            </button>

        </div>

        <p id="passwordRequirements" class="password-requirements">
            Password must contain at least one letter, one number,
            and one of ! @ # $ &gt; _
        </p>


        <!-- PIN -->

        <label for="pinInput">
            PIN
        </label>

        <input
            type="text"
            id="pinInput"
            readonly
        >


        <!-- Save -->

        <button
            type="button"
            id="saveAccountBtn"
            class="save-button"
        >
            Save
        </button>

        <p id="signupMessage" class="signup-message"></p>

    </div>

</div>


<!-- ============================= -->
<!-- ACCOUNT ICON -->
<!-- ============================= -->

<button id="accountIcon" class="account-icon">
    <i class="fa-solid fa-user"></i>
</button>


<!-- ============================= -->
<!-- ACCOUNT INFORMATION -->
<!-- ============================= -->

<div id="accountOverlay" class="account-overlay">

    <div class="account-info-box">

        <button id="closeAccountBtn" class="account-back-button">
            ← Back
        </button>

        <h2>Account</h2>

        <div class="account-detail">
            <strong>Username</strong>
            <span id="displayUsername"></span>
        </div>

        <div class="account-detail">
            <strong>Password</strong>

            <div class="display-password-container">

                <span id="displayPassword">
                    ••••••••
                </span>

                <button
                    type="button"
                    id="accountPasswordToggle"
                >
                    Show Pass
                </button>

            </div>
        </div>

        <div class="account-detail">
            <strong>PIN</strong>
            <span id="displayPin"></span>
        </div>

    </div>

</div>

<!-- -----Home Page Nav bar----- -->

    <nav class="navbar">

        <button id="homeBtn" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </button>

        <button id="howBtn" class="nav-item">
            <i class="fa-solid fa-circle-question"></i>
            <span>How It Works</span>
        </button>

        <button id="settingsBtn" class="nav-item">
            <i class="fa-solid fa-gear"></i>
            <span>Settings</span>
        </button>

    </nav>


    <div id="content"></div>


    <script src="new.js"></script>

</body>

</html>
