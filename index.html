<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <!-- Login Screen -->
<div id="loginScreen" class="login-screen">

    <div class="login-box">

        <!-- Sign In Side -->
        <div class="login-side sign-in-side">

            <button id="signInBtn" class="account-button">
                Sign In
            </button>

            <p>Login into existing account</p>

        </div>


        <!-- Sign Up Side -->
        <div class="login-side sign-up-side">

            <button id="signUpBtn" class="account-button">
                Sign Up
            </button>

            <p>Create a new account</p>

        </div>

    </div>

</div>

<!-- -----Home Page Nav bar----- -->

    <nav class="navbar">

        <button id="homeBtn" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </button>

        <button id="howBtn" class="nav-item">
            <i class="fa-solid fa-circle-question"></i>
            <span>How It Works</span>
        </button>

        <button id="settingsBtn" class="nav-item">
            <i class="fa-solid fa-gear"></i>
            <span>Settings</span>
        </button>

    </nav>


    <div id="content"></div>


    <script src="new.js"></script>

</body>

</html>
